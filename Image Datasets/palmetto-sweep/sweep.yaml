# Replace these with absolute Linux paths visible on every compute node.
project_dir: ~/research/ml/Exam-Level-Medical-Imaging-submission/Image Datasets
python: /home/bformby/.conda/envs/pytorch/bin/python
results_dir: ~/research/ml/Exam-Level-Medical-Imaging-submission/Image Datasets/results
radimagenet_checkpoint: /home/bformby/research/ml/weights/radimagenet/ResNet50.pt

# Use a new name when changing data, preprocessing, or experimental settings.
run_name: frozen_sweep
datasets: [achilles, ct, mri, xray]
pooling: [avg, max, attn, tanh_attn, transformer]
sources: [imagenet, radimagenet, instance] # Full sweep: [imagenet, radimagenet, instance]
num_epochs: null # Applies to both stages; set null to use each dataset config's epochs

# Same architecture, seed, folds, and attention head count across comparisons.
seed: 123
folds: 10
num_heads: 16
freeze_encoder: true

# The trainer defaults to last and saving enabled. This sweep disables MIL weight files.
model_selection: last # last or best_loss (lowest validation loss)
save_models: false # Instance-pretraining checkpoints are still saved for transfer

# One shared instance-training run per dataset; it learns from inherited bag labels.
instance_initialization: imagenet

# Resource estimates only: calibrate with one representative run per dataset.
cpus: 8
resources:
  achilles: {mem_mb: 32000, runtime_minutes: 60}
  ct: {mem_mb: 32000, runtime_minutes: 240}
  mri: {mem_mb: 32000, runtime_minutes: 240}
  xray: {mem_mb: 32000, runtime_minutes: 120}
