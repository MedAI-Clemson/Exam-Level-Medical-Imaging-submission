# A separate method comparison: no pretraining/freezing grid and no model files.
project_dir: ..
python: /home/bformby/.conda/envs/pytorch/bin/python
results_dir: ../results
run_name: comparison_achilles_large_bags_v1
experiments: [achilles_sparsity]
methods: [dtfd_afs, clam, promil]
seed: 123
folds: 10
save_models: false
epochs_override: null # Set to 1 with a new run_name for a smoke test.

# Read exact saved bags, including the existing train/validation/test membership.
mnist_data_dir: ~/research/ml/data/mnist
mnist_source_run: mnist_composition_v2
mnist_densities_by_bag_size:
  10: [10, 20, 50]
  20: [5, 10, 25, 50]
  100: [1, 5, 10, 25, 50]
achilles_source_run: achilles_sparsity_frozen_large_bags_v1
achilles_bag_sizes: [50, 100]
medical_datasets: [achilles, ct, mri, xray]

# Author-code defaults unless noted in SOURCES.md. No common encoder is imposed.
profiles:
  dtfd_afs:
    epochs: 200
    lr: 0.0001
    weight_decay: 0.0001
    milestones: [100]
    gamma: 0.2
    groups: 4
    clip: 5.0
    inference_repeats: 1
    patience: null
  clam:
    epochs: 200
    lr: 0.0001
    weight_decay: 0.00001
    dropout: 0.25
    k: 8
    bag_weight: 0.7
    patience: 20 # Used only for MNIST, which has a separate validation and test set.
    minimum_epochs: 50
  promil:
    mnist:
      epochs: 100
      lr: 0.0001
      betas: [0.99, 0.999]
      weight_decay: 0.00001
      dropout: 0.0
      warmup_epochs: 0
      patience: 15
    medical:
      epochs: 125
      warmup_epochs: 25 # ImageNet ResNet-18 frozen for 25 epochs, then trainable for 100.
      lr: 0.0001 # Chosen from the paper's search range; not a reported universal optimum.
      betas: [0.9, 0.999]
      weight_decay: 0.00001
      dropout: 0.2
      patience: null

cpus: 8
num_workers: 7
feature_batch_size: 32
mem_mb: 64000
runtime_minutes: 2880 # Each medical/Achilles training job contains ten folds.
