# Run from Image Datasets/achilles-sparsity-sweep on Palmetto.
project_dir: ..
python: /home/bformby/.conda/envs/pytorch/bin/python
data_dir: /project/dane2/wficai/Data/mil_exam_level/achilles_multiclass_data
metadata_csv: /project/dane2/wficai/Data/mil_exam_level/achilles_multiclass_data/achilles_multiclass_metadata.csv
image_number_regex: 'img(?P<image_number>\d+)'
image_extensions: [.png]
results_dir: ../results
run_name: achilles_sparsity_baselines_v1
# Import exact existing bags, including donor duplicates, instead of resampling.
source_runs:
  5: achilles_sparsity_frozen_v1
  10: achilles_sparsity_frozen_v1
  25: achilles_sparsity_frozen_v1
  50: achilles_sparsity_frozen_large_bags_v1
  100: achilles_sparsity_frozen_large_bags_v1

# Fixed binary mapping: 0/1 -> healthy group, 2/3 -> unhealthy group.
bag_sizes: [5, 10, 25, 50, 100]
# Keep distinct donors first; repeat healthy donor images only after exhausting the pool.
replacement_if_needed: true
pooling: [instance, stan]
folds: 10
seed: 123
threshold: 0.5

# Frozen ImageNet encoder; all configured attention head counts remain 16.
encoder: resnet50
freeze_encoder: true
num_heads: 16
num_heads_by_pooling: {tanh_attn: 16}
resolution: 224
drop_rate: 0.0
num_epochs: 10
model_selection: last
save_models: false
learning_rate: 0.001
weight_decay: 0.001
scheduler_step: 8
scheduler_gamma: 0.1
batch_size: 1

num_workers: 7
cpus: 8
mem_mb: 32000
runtime_minutes: 360 # Per job: all ten folds; adjust after the first completed job.
