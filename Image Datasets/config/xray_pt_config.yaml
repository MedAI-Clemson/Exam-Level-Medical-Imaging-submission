task: xray
seed: 123
device: auto

# file paths
save_dir: "./xray/pretrain"
data_dir: "/home/bformby/research/ml/Xray/data/"
metadata_csv: "/home/bformby/research/ml/Xray/images.csv"
targets_csv: "/home/bformby/research/ml/Xray/targets.csv"

# data loading
loader_kwargs:
    batch_size: 75
    num_workers: 4
res: 224 # height and width

# encoder
pretraining: imagenet # Starting weights for training individual images with bag labels
encoder_kwargs:
    model_name: 'resnet50d'
    in_chans: 1
    num_classes: 3
    drop_rate: 0.0

# training
mil: False
model_selection: last # last or best_loss (lowest validation loss)
save_models: True # Required when these weights initialize later MIL experiments
view_filter: ['AP_LIKE', 'Y']
num_epochs: 50
optim_kwargs:
    lr: 1.e-3
    weight_decay: 1.e-3
sched_kwargs:
    step_size: 50
    gamma: 0.1
freeze_enc: False
freeze_clf: False
folds: 10
