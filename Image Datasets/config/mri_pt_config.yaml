task: mri
seed: 123
device: auto
preprocessing:
    mri_percentiles: [1, 99] # Per-slice clipping followed by scaling to [0, 1]

# file paths
save_dir: "./mri/pretrain"
data_dir: "/home/bformby/research/ml/MRI/data/"
metadata_csv: "/home/bformby/research/ml/MRI/mri_metadata.csv"

# data loading
loader_kwargs:
    batch_size: 75
    num_workers: 4
res: 224 # height and width

# encoder
pretraining: imagenet # Starting weights for training individual images with bag labels
encoder_kwargs:
    model_name: 'resnet50d'
    in_chans: 1
    num_classes: 1
    drop_rate: 0.1

# training
mil: False
model_selection: last # last or best_loss (lowest validation loss)
save_models: True # Required when these weights initialize later MIL experiments
view_filter: ['t2_tse_cor','t2_tse_sag','t2_tse_tra']
use_k: False
num_epochs: 15
optim_kwargs:
    lr: 1.e-3
    weight_decay: 5.e-3
sched_kwargs:
    step_size: 50
    gamma: 0.1
freeze_enc: False
freeze_clf: False
folds: 10
