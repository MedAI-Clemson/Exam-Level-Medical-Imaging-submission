task: mri
seed: 123
device: auto
preprocessing:
    mri_percentiles: [1, 99] # Per-slice clipping followed by scaling to [0, 1]

# file paths
save_dir: "./test/mri/"
pretrained_model_dir: "./mri/pretrain"
data_dir: "../MRI/data/"
metadata_csv: "../MRI/mri_metadata.csv"

# data loading
loader_kwargs:
    batch_size: 3
    num_workers: 8
res: 224 # height and width

# model
net_kwargs:
    num_heads: 1
    num_out: 1
    pooling_method: 'attn'
    drop_rate: 0.0
    debug: False

# encoder
pretraining: imagenet # imagenet, radimagenet, or instance
encoder_kwargs:
    model_name: 'resnet50d'
    in_chans: 1
    num_classes: 1
    drop_rate: 0.1

# training
mil: True
model_selection: last # last or best_loss (lowest validation loss)
save_models: False # Current experiment: export metrics/predictions without model files
view_filter: ['t2_tse_cor','t2_tse_sag','t2_tse_tra']
use_k: False
num_epochs: 10
optim_kwargs:
    lr: 1.e-3
    weight_decay: 5.e-4
sched_kwargs:
    step_size: 50
    gamma: 0.1
freeze_enc: False
freeze_clf: False
folds: 10
