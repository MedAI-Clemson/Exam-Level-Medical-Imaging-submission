task: ct
seed: 123
device: auto
preprocessing:
    ct_window: [-1000, 400] # HU clipping bounds; review for the experiment

# file paths
save_dir: "./ct/pretrain"
data_dir: "/home/bformby/research/ml/CT/data/"
metadata_csv: "/home/bformby/research/ml/CT/ct_metadata.csv"

# data loading
loader_kwargs:
    batch_size: 50
    num_workers: 8
res: 224 # height and width

# encoder
pretraining: imagenet # Starting weights for training individual images with bag labels
encoder_kwargs:
    model_name: 'resnet50d'
    in_chans: 1
    num_classes: 1
    drop_rate: 0.2

# training
mil: False
model_selection: last # last or best_loss (lowest validation loss)
save_models: True # Required when these weights initialize later MIL experiments
num_epochs: 10
optim_kwargs:
    lr: 1.e-3
    weight_decay: 5.e-3
sched_kwargs:
    step_size: 50
    gamma: 0.1
freeze_enc: False
freeze_clf: False
folds: 10
