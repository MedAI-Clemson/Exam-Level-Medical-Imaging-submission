task: achilles
seed: 123
device: auto

# file paths
save_dir: "./test/achilles/"
pretrained_model_dir: "./achilles/pretrain"
data_dir: "/home/bformby/research/ml/Achilles_Classification/roi_data/"
metadata_csv: "/home/bformby/research/ml/Achilles_Classification/roi_data/mil_metadata.csv"

# data loading
loader_kwargs:
    batch_size: 15
    num_workers: 8
res: 224 # height and width

# model
net_kwargs:
    num_heads: 1
    num_out: 1
    pooling_method: 'attn'
    drop_rate: 0.0
    debug: False

# encoder
pretraining: instance # imagenet, radimagenet, or instance
instance_load_clf: True # Also transfer the instance classifier into the MIL classifier
encoder_kwargs:
    model_name: 'resnet50d'
    in_chans: 1
    num_classes: 1
    drop_rate: 0.0

# training
mil: True
model_selection: last # last or best_loss (lowest validation loss)
save_models: False # Current experiment: export metrics/predictions without model files
num_epochs: 30
optim_kwargs:
    lr: 1.e-3
    weight_decay: 1.e-3
sched_kwargs:
    step_size: 8
    gamma: 0.1
freeze_enc: False
freeze_clf: False
folds: 10
