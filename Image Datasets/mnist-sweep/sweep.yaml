# Run from Image Datasets/mnist-sweep. Independent of palmetto-sweep/sweep.yaml.
project_dir: ..
python: /home/bformby/.conda/envs/pytorch/bin/python
data_dir: ~/research/ml/data/mnist
results_dir: ../results
run_name: mnist_composition_v2

pooling: [avg, max, attn, tanh_attn, transformer]
# Percent digit 9 in positive bags, specified separately for each bag size.
densities_by_bag_size:
  10: [10, 20, 50]
  20: [5, 10, 25, 50]
  100: [1, 5, 10, 25, 50]
target_digit: 9
seed: 123
train_bags: 1000
val_bags: 200
test_bags: 1000
validation_fraction: 0.2

# One configuration throughout: ImageNet encoder, random MIL classifier.
num_epochs: 10
model_selection: last
save_models: false
encoder: resnet50
freeze_encoder: true
num_heads: 16
resolution: 224
drop_rate: 0.0
learning_rate: 0.001
weight_decay: 0.001
scheduler_step: 8
scheduler_gamma: 0.1
batch_size: 1 # One whole bag; up to 100 images with encoder gradients.
num_workers: 8
cpus: 8
mem_mb: 32000
runtime_minutes: 720 # Initial estimate; adjust after the smoke test.
