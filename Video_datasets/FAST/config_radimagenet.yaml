# data loading

# RadImageNet ResNet50 (https://huggingface.co/Lab-Rasool/RadImageNet), loaded in train_cv_radimagenet.py
radimagenet_weights: 'pretrained/radimagenet/ResNet50.pt'


subset_column: null

dataset_kwargs:
  transforms: null
  split: null
  
dataloader_kwargs:
    batch_size: 15 
    num_workers: 40
    pin_memory: True
res: 112 # height and width
time_downsample_kwargs:
    method: 'random'
    num_frames: 32
    
#model
encoder_kwargs:
    model_name: 'resnet50'  # RadImageNet weights are plain resnet50, not resnet50d
    pretrained: False
    in_chans: 3
vidnet_kwargs:
    num_heads: 16
    num_out: 1
    pooling_method: 'attn'
    drop_rate: 0.5

# training
num_epochs: 200
optim_kwargs:
    lr: 1.e-4
    weight_decay: 1.e-3
sched_kwargs:
    factor: 0.1
    patience: 3
    verbose: True
early_stopper_kwargs:
    patience: 10